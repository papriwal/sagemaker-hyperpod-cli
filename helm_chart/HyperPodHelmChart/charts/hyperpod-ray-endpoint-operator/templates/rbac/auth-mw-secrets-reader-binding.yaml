apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app.kubernetes.io/component: auth-middleware
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/name: {{ include "hyperpod-ray-endpoint-operator.name" . }}
    helm.sh/chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    app.kubernetes.io/instance: {{ .Release.Name }}
  name: {{ include "hyperpod-ray-endpoint-operator.resourceName" (dict "suffix" "auth-mw-secrets-reader-binding" "context" $) }}
  namespace: {{ .Values.namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "hyperpod-ray-endpoint-operator.resourceName" (dict "suffix" "auth-mw-secrets-reader" "context" $) }}
subjects:
- kind: ServiceAccount
  name: {{ include "hyperpod-ray-endpoint-operator.resourceName" (dict "suffix" "auth-middleware" "context" $) }}
  namespace: {{ .Values.namespace }}
